<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <h1 class="pixel-title"><a href="{{ '/' | relative_url }}" style="text-decoration:none; color:inherit;">{{ site.title }}</a></h1>
    <div class="site-tagline">{{ site.description }}</div>
    <nav class="dialogue-box">
      <span class="cursor">&#9654;</span><a href="{{ '/about/' | relative_url }}">about</a><span class="sep">|</span><a href="{{ '/projects/' | relative_url }}">projects</a><span class="sep">|</span><a href="{{ '/notes/' | relative_url }}">notes</a>
    </nav>
    <hr>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    last updated {{ site.time | date: "%Y-%m-%d" }} — built with Jekyll
  </footer>
</body>
</html>
