<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <h1 class="pixel-title"><a href="{{ '/' | relative_url }}" style="text-decoration:none; color:inherit;">{{ site.title }}</a></h1>
    <div class="site-tagline">{{ site.description }}</div>
    <nav class="dialogue-box">
      {% for entry in site.data.nav %}
        <a href="{{ entry.url | relative_url }}" {% if page.url == entry.url %}class="active"{% endif %}>
          {% if page.url == entry.url %}<span class="cursor">&#9654;</span>{% endif %}{{ entry.label }}
        </a>
        {% unless forloop.last %}<span class="sep">|</span> {% endunless %}
      {% endfor %}
    </nav>
    <hr>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    last updated {{ site.time | date: "%Y-%m-%d" }} — built with Jekyll
  </footer>
</body>
</html>
