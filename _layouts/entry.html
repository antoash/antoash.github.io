---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <div class="meta">
    {{ page.date | date: "%Y-%m-%d" }}
    {% if page.tags %} — {{ page.tags | join: ", " }}{% endif %}
  </div>
  <hr>
  {{ content }}
</article>

<hr>
<p><a href="{{ page.collection | prepend: '/' | append: '/' | relative_url }}">&larr; back to {{ page.collection }}</a></p>
